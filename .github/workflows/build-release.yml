name: Targeted donation test diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Targeted tests, original heap, bounded task and full failure stack
        timeout-minutes: 8
        run: |
          cat > "$RUNNER_TEMP/targeted.gradle" <<'INIT'
          allprojects {
            tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
              maxHeapSize = '512m'
              maxParallelForks = 1
              failFast = true
              timeout = java.time.Duration.ofMinutes(3)
              jvmArgs '-XX:-ExitOnOutOfMemoryError', '-XX:-HeapDumpOnOutOfMemoryError'
              testLogging {
                events 'started', 'passed', 'failed'
                showStandardStreams = true
                exceptionFormat 'full'
              }
            }
          }
          INIT
          cat > ui-lib/src/test/java/co/electriccoin/zcash/ui/common/donation/DonationDiagnosticRunner.kt <<'KOTLIN'
          package co.electriccoin.zcash.ui.common.donation
          import org.robolectric.RobolectricTestRunner
          import org.junit.runner.notification.RunNotifier
          import org.junit.runner.notification.RunListener
          import org.junit.runner.notification.Failure
          class DonationDiagnosticRunner(type: Class<*>) : RobolectricTestRunner(type) {
              override fun run(notifier: RunNotifier) {
                  notifier.addFirstListener(object : RunListener() {
                      override fun testFailure(failure: Failure) {
                          var current: Throwable? = failure.exception
                          val seen = java.util.Collections.newSetFromMap(java.util.IdentityHashMap<Throwable, Boolean>())
                          repeat(12) { depth ->
                              val error = current ?: return
                              if (!seen.add(error)) return
                              val message = try { error.message.orEmpty().take(240) } catch (_: Throwable) { "unavailable" }
                              println("DONATION_BOUNDED_CAUSE $depth ${error.javaClass.name} $message")
                              error.stackTrace.take(8).forEach { println("DONATION_BOUNDED_FRAME $it") }
                              current = error.cause
                          }
                      }
                  })
                  super.run(notifier)
              }
          }
          KOTLIN
          sed -i 's/@RunWith(RobolectricTestRunner::class)/@RunWith(DonationDiagnosticRunner::class)/' ui-lib/src/test/java/co/electriccoin/zcash/ui/common/donation/AutoDonationCoordinatorTest.kt
          chmod +x gradlew
          ./gradlew -I .private/robolectric-ci.gradle -I "$RUNNER_TEMP/targeted.gradle" --no-daemon --no-watch-fs --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2g -XX:MaxMetaspaceSize=1g' -Pkotlin.compiler.execution.strategy=in-process :ui-lib:testZcashmainnetFossReleaseUnitTest --tests 'co.electriccoin.zcash.ui.common.donation.AutoDonationCoordinatorTest'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: targeted-donation-test-report
          path: ui-lib/build/test-results/
          retention-days: 1
